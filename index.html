<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Markdown studio — a local-first, Apple-inspired Markdown writing studio." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Markdown studio" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Markdown studio</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('mdstudio.preferences.v1') || 'null');
          var mode = stored && stored.state && stored.state.appearance;
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = mode === 'light' || mode === 'dark' ? mode : dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#f5f5f7');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
